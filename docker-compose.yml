version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: ugc_platform_db
    environment:
      POSTGRES_USER: ugc_user
      POSTGRES_PASSWORD: ugc_password
      POSTGRES_DB: ugc_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - ugc_network

  redis:
    image: redis:7-alpine
    container_name: ugc_platform_redis
    ports:
      - '6379:6379'
    networks:
      - ugc_network

volumes:
  postgres_data:

networks:
  ugc_network:
    driver: bridge
